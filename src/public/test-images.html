<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Product Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .test-container {
      margin-bottom: 30px;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
    }
    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .image-box {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      width: 300px;
    }
    .image-box img {
      max-width: 100%;
      height: auto;
      border-radius: 3px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .success {
      color: green;
      margin-top: 10px;
    }
    #urlResult {
      margin-top: 10px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Test Product Images</h1>
  
  <div class="test-container">
    <h2>1. Test Default Images</h2>
    <div class="image-container">
      <div class="image-box">
        <h3>Default Product Image</h3>
        <img src="/uploads/products/default-product.jpg" alt="Default Product" />
        <p>Path: /uploads/products/default-product.jpg</p>
      </div>
    </div>
  </div>

  <div class="test-container">
    <h2>2. Test by Filename</h2>
    <div>
      <input type="text" id="imageFilename" placeholder="Enter image filename (e.g., iphone-15-pro-max-đỏ.jpg)" />
      <button onclick="testImage()">Test Image</button>
      <div id="imageResult" class="image-container"></div>
    </div>
  </div>

  <div class="test-container">
    <h2>3. Test Full URL</h2>
    <div>
      <input type="text" id="imageUrl" placeholder="Enter full image URL" />
      <button onclick="testFullUrl()">Test URL</button>
      <div id="urlResult"></div>
    </div>
  </div>

  <div class="test-container">
    <h2>4. Test Product API</h2>
    <div>
      <input type="text" id="productId" placeholder="Enter product ID" />
      <button onclick="testProductAPI()">Get Product</button>
      <div id="productResult" class="image-container"></div>
    </div>
  </div>

  <script>
    function testImage() {
      const filename = document.getElementById('imageFilename').value.trim();
      if (!filename) {
        document.getElementById('imageResult').innerHTML = '<div class="error">Please enter a filename</div>';
        return;
      }

      document.getElementById('imageResult').innerHTML = '';
      const imageBox = document.createElement('div');
      imageBox.className = 'image-box';
      
      const heading = document.createElement('h3');
      heading.textContent = filename;
      
      const img = document.createElement('img');
      img.src = `/uploads/products/${filename}`;
      img.alt = filename;
      img.onerror = function() {
        document.getElementById('imageResult').innerHTML = '<div class="error">Image not found or cannot be loaded</div>';
      };
      img.onload = function() {
        document.getElementById('imageResult').appendChild(imageBox);
      };
      
      const path = document.createElement('p');
      path.textContent = `Path: /uploads/products/${filename}`;
      
      imageBox.appendChild(heading);
      imageBox.appendChild(img);
      imageBox.appendChild(path);
    }

    function testFullUrl() {
      const url = document.getElementById('imageUrl').value.trim();
      if (!url) {
        document.getElementById('urlResult').innerHTML = '<div class="error">Please enter a URL</div>';
        return;
      }

      document.getElementById('urlResult').innerHTML = '';
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Test URL Image';
      img.style.maxWidth = '300px';
      img.onerror = function() {
        document.getElementById('urlResult').innerHTML = '<div class="error">Image URL not valid or cannot be loaded</div>';
      };
      img.onload = function() {
        document.getElementById('urlResult').innerHTML = '<div class="success">Image loaded successfully!</div>';
        document.getElementById('urlResult').appendChild(img);
      };
    }

    function testProductAPI() {
      const productId = document.getElementById('productId').value.trim();
      if (!productId) {
        document.getElementById('productResult').innerHTML = '<div class="error">Please enter a product ID</div>';
        return;
      }

      document.getElementById('productResult').innerHTML = '<div>Loading...</div>';
      
      fetch(`/api/products/show/${productId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Product not found');
          }
          return response.json();
        })
        .then(data => {
          if (!data.success) {
            throw new Error(data.message || 'Failed to load product');
          }
          
          const product = data.data;
          let html = '<div class="image-box">';
          html += `<h3>${product.product_name}</h3>`;
          html += `<img src="${product.image_url}" alt="${product.product_name}" />`;
          html += `<p>Main Image: ${product.image_url}</p>`;
          html += '</div>';
          
          // Display gallery images if available
          if (product.image_gallery && product.image_gallery.length > 0) {
            product.image_gallery.forEach(img => {
              html += '<div class="image-box">';
              html += `<h3>Gallery Image</h3>`;
              html += `<img src="${img}" alt="Gallery" />`;
              html += `<p>Gallery Image: ${img}</p>`;
              html += '</div>';
            });
          }
          
          document.getElementById('productResult').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('productResult').innerHTML = `<div class="error">${error.message}</div>`;
        });
    }
  </script>
</body>
</html>
